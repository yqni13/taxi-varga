<div class="tava-textarea-wrapper" ngClass="{{ngClass()}}">
	<div class="tava-textarea {{className()}}">
		<textarea
			id="{{'tava-' + fieldName()}}"
			[formField]="field"
			placeholder="{{placeholder()}}"
			rows="{{rows()}}"
			ngClass="{{hasError() && !isFocused() ? 'tava-input-padding-error' : 'tava-input-padding-base'}}"
		></textarea>
		@if (((isFocused() && hasErrorOnFocus()) || !isFocused()) && hasError()) {
			<i
				id="error-icon"
				class="icon-base icon-Warning"
			></i>
		}
	</div>
	@if (hasError()) {
		<tava-validation
			[fieldState]="fieldState()"
            [fieldName]="fieldName()"
            [isFocused]="isFocused()"
            [errOnFocusList]="errorOnFocusList"
		></tava-validation>
	}
	@if (lengthLimit() !== 0 && field().value().length <= lengthLimit()) {
        <span id="textareainput-length">
            {{(lengthLimit()
            - field().value().length)
            + ' / ' + lengthLimit()}}
        </span>
    }
</div>
