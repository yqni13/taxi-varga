<div class="tava-text-wrapper" ngClass="{{ngClass()}}">
	<div class="tava-text {{className()}}">
		<input
			type="{{inputType()}}"
			placeholder="{{placeholder()}}"
			id="{{'tava-' + fieldName()}}"
			[formField]="field"
			min="{{minVal()}}"
			max="{{maxVal()}}"
			ngClass="{{
				hasError() && !isFocused() && inputType() !== 'time' && inputType() !== 'datetime-local' 
					? 'tava-input-padding-error' 
					: 'tava-input-padding-base'
			}}"
		>
		@if (((isFocused() && hasErrorOnFocus()) || !isFocused()) && hasError()) {
			<i
				id="error-icon"
				class="icon-warning icon-base"
				[ngClass]="classNameWarningIcon"
			></i>
		}
	</div>
	@if (hasError()) {
		<tava-validation
			[fieldState]="fieldState()"
            [fieldName]="fieldName()"
            [isFocused]="isFocused()"
            [errOnFocusList]="errorOnFocusList"
		></tava-validation>
	}
</div>
