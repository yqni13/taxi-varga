<div class="tava-select-wrapper" ngClass="{{ngClass()}}">
	<div class="tava-select {{className()}}" >
		<select
			id="{{'tava-' + fieldName()}}"
			[formField]="field"
			(change)="selectOption($event)"
			ngClass="{{hasError() && !isFocused() ? 'tava-input-padding-error' : 'tava-input-padding-base'}}"
		>
		<option value="" disabled>{{placeholder()}}</option>
		<hr>
		@for (option of options() ?? {} | keyvalue; track option.key) {
			<option
				value="{{option.value}}"
			>{{optionsTranslateRoot() + (option.key) | translate}}</option>
		}
		</select>
		@if (((isFocused() && hasErrorOnFocus()) || !isFocused()) && hasError()) {
			<i
				id="error-icon"
				class="icon-warning icon-base"
			></i>
		}
	</div>
	@if (hasError()) {
		<tava-validation
			[fieldState]="fieldState()"
            [fieldName]="fieldName()"
            [isFocused]="isFocused()"
            [errOnFocusList]="errorOnFocusList"
		></tava-validation>
	}
</div>
