<!-- Original design inspired by: https://codepen.io/andreacrawford/pen/NvqJXW -->
<div id="tava-starrating">
    <div class="tava-starrating-wrapper">
        <input disabled checked class="rating__input rating__input--none" name="rating" id="rating-none" value="0" type="radio">
        @for (star of stars; track star) {
            <label class="rating__label" for="{{'star' + star}}">
                <i
                    class="icon-star icon-base rating__icon rating__icon--star"
                    [ngClass]="hasNewRating() ? 'star-active' : 'star-passive'"
                ></i>
            </label>
            <input
                class="rating__input"
                name="rating"
                id="{{'star' + star}}"
                [value]="star"
                type="radio"
                [checked]="selectedStar() === star"
                (change)="onChange($event)"
            >
        }
    </div>
    <div id="tava-rating-value-wrapper">
        <span id="tava-rating-value">{{rawRating()}}</span>
        <span id="tava-rating-text">{{'common.component.star-rating.select' | translate}}</span>
    </div>
</div>
